<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Non-Chain BBQ Across the U.S.</title>
    	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.0/dist/leaflet.css"/>
	<link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.7.0/css/all.css">

    <style>
 	html, body, #map { width: 100%; height: 100%; margin: 0; background: #fff; }
     .legend {
    line-height: 40px;
    font-size: 16px;
    width: 190px;
    color: #333333;
    padding: 6px 8px;
    background: white;
    background: rgba(255,255,255,0.5);
    box-shadow: 0 0 15px rgba(0,0,0,0.2);
    border-radius: 5px;
    z-index: 1000;
    .legend {

    font-family: 'Times New Roman', Times, serif;
    }
}
 
    .legend i {
        width: 20px;
        height: 20px;
        float: left;
        margin-right: 8px;
        opacity: 0.9;
}
 
    .legend img {
        width: 16px;
        height: 16px;
        margin-right: 3px;
        float: left;
}
 
    .legend p {
        font-size: 14px;
        line-height: 20px;
        margin: 0;
}
    .leaflet-control-worldminimap {
            z-index: 999;
}
    
    </style>
    	<link href="https://fonts.googleapis.com/css?family=Titillium+Web" rel="stylesheet">
	<script src="https://unpkg.com/leaflet@1.7.0/dist/leaflet.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-ajax/2.1.0/leaflet.ajax.min.js"></script>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.0/jquery.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/1.3.4/chroma.min.js"></script>
    
</head>
<body>

<div id="map"></div>
<script>
 
    var mymap = L.map('map', {
        center: [41.274028, -96.144803], 
        zoom: 1, 
        maxZoom: 40,
        minZoom: 5,
        detectRetina: true 
});
 
    L.tileLayer('http://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png').addTo(mymap);

    var bbq_locations = null;

    var colors = ['#d73027', '#fc8d59', '#fee08b', '#d9ef8b', '#91cf60', '#1a9850'];

    for (i = 0; i < 6; i++) {
        $('head').append($("<style> .marker-color-" + (i + 1).toString() + " { color: " + colors[i] + "; font-size: 15px; text-shadow: 0 0 3px #ffffff;} </style>"));
}

    bbq_locations = L.geoJson.ajax("assets/bbq_locations.geojson",{
 
        onEachFeature: function (feature, layer) {
        layer.bindPopup(feature.properties.property_t);
  },
 
    pointToLayer: function(feature, latlng) {
        var id = 0;
        if (feature.properties.Average_Rating >= 5) { id = 5; }
        else if (feature.properties.Average_Rating >=4)  { id = 4; }
        else if (feature.properties.Average_Rating >=3)  { id = 3; }
        else if (feature.properties.Average_Rating >=2)  { id = 2; }
        else if (feature.properties.Average_Rating >=1)  { id = 1; }
        else { id = 0;} 
        var marker = L.marker(latlng, {icon: L.divIcon({html: '<i class="fa-solid fa-fire marker-color-' + (id + 1).toString() + '"></i>',
                className: '', 
                iconSize: [30, 30]
            })
    });

    var name = feature.properties.Name || "Name";
    var address = feature.properties.Address || "Address";

    marker.bindTooltip("<strong>" + name + "</strong><br>" + address, {
        permanent: false,
        direction: "top",
        sticky: true
    });

    return marker;

},
    attribution: 'Non Chain BBQ listings | State Polygons &copy; US Census Open Data | Base Map &copy; CartoDB | Map Author: '
        }).addTo(mymap);

    colors = chroma.scale('blues').colors(6); 
    
    function setColor(density) {
        var id = 0;
        if (density > 20000000) { id = 5; } 
        else if (density > 15000000 && density <= 20000000) { id = 4; } 
        else if (density > 5000000 && density <= 15000000) { id = 3; } 
        else if (density > 100000 && density <= 5000000) { id = 2; } 
        else if (density > 60000 &&  density <= 100000) { id = 1; } 
        else  { id = 0; }
        return colors[id];
}

    function style(feature) {
        return {
            fillColor: setColor(feature.properties.Sate_pop_POPESTIMATE2024),
            fillOpacity: 0.4,
            weight: 2,
            opacity: 1,
            color: '#030303',
            dashArray: '1'
        };
}

    L.geoJson.ajax("assets/2024_USpop.geojson", {
        style: style
        }).addTo(mymap);

var legend = L.control({position: 'topright'});
 
legend.onAdd = function () {
 
    var div = L.DomUtil.create('div', 'legend');
    
    div.innerHTML += '<b>Population in the State</b><br />';
   
    div.innerHTML += '<i style="background: ' + colors[5] + '; opacity: 0.5"></i><p>30000000+</p>';
    div.innerHTML += '<i style="background: ' + colors[4] + '; opacity: 0.5"></i><p>15000000-20000000</p>';
    div.innerHTML += '<i style="background: ' + colors[3] + '; opacity: 0.5"></i><p>5000000-15000000</p>';
    div.innerHTML += '<i style="background: ' + colors[2] + '; opacity: 0.5"></i><p>100000-5000000</p>';
    div.innerHTML += '<i style="background: ' + colors[1] + '; opacity: 0.5"></i><p>60000-100000</p>';
    div.innerHTML += '<i style="background: ' + colors[0] + '; opacity: 0.5"></i><p> 0-60000</p>';
    
    div.innerHTML += '<hr><b>Rating<b><br />';
    
    div.innerHTML += '<i class="fa-solid fa-fire marker-color-1"></i><p>0</p>';
    div.innerHTML += '<i class="fa-solid fa-fire marker-color-2"></i><p>1</p>';
    div.innerHTML += '<i class="fa-solid fa-fire marker-color-3"></i><p>2</p>';
    div.innerHTML += '<i class="fa-solid fa-fire marker-color-4"></i><p>3</p>';
    div.innerHTML += '<i class="fa-solid fa-fire marker-color-5"></i><p>4</p>';
    div.innerHTML += '<i class="fa-solid fa-fire marker-color-6"></i><p>5</p>';
   
    return div;
};
 
legend.addTo(mymap);

L.control.scale({position: 'bottomleft'}).addTo(mymap);

</script>
</body>
</html>
